[project]
name = "q2-gatk"
version = "0.1.7"
description = "QIIME 2 plugin for GATK variant calling"
requires-python = ">=3.10"
authors = []

[project.entry-points."qiime2.plugins"]
"q2-gatk" = "q2_gatk.plugin_setup:plugin"

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "codespell>=2.2.2",
    "pyright>=1.1.293",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["q2_gatk"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["q2_gatk"]

[tool.pyright]
reportMissingImports = false
